# Parabol + Postgres + Valkey (Redis) for Coolify's Docker Compose build pack.
# SERVICE_* values are generated by Coolify on first deploy and persist across deploys.
services:
  parabol:
    build:
      context: .
      dockerfile: Dockerfile.coolify
    restart: unless-stopped
    depends_on:
      - postgres
      - valkey
    volumes:
      # FILE_STORE_PROVIDER=local writes uploads here, relative to the app's working directory
      - parabol-files:/home/node/parabol/self-hosted
    environment:
      - SERVICE_FQDN_PARABOL_3000
      - HOST=${SERVICE_FQDN_PARABOL}
      - PROTO=${PROTO:-https}
      - PORT=3000
      - SERVER_ID=1
      - SERVER_SECRET=${SERVICE_REALBASE64_64_SERVERSECRET}
      # Coolify's proxy replaces X-Forwarded-For with the client IP, so read the last entry
      - TRUSTED_PROXY_COUNT=0
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=parabol
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=parabol
      - POSTGRES_USE_PGVECTOR=true
      - REDIS_URL=redis://valkey:6379
      - REDIS_PASSWORD=${SERVICE_PASSWORD_VALKEY}
      - FILE_STORE_PROVIDER=local
      - AUTH_EMAIL_VERIFICATION_DISABLED=${AUTH_EMAIL_VERIFICATION_DISABLED:-true}
      # the login page shows these buttons unless disabled, even without OAuth client ids
      - AUTH_GOOGLE_DISABLED=${AUTH_GOOGLE_DISABLED:-true}
      - AUTH_MICROSOFT_DISABLED=${AUTH_MICROSOFT_DISABLED:-true}
      # debug logs every email instead of sending it
      - MAIL_PROVIDER=${MAIL_PROVIDER:-debug}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-587}
      - MAIL_SMTP_USER=${MAIL_SMTP_USER}
      - MAIL_SMTP_PASSWORD=${MAIL_SMTP_PASSWORD}
      - MAIL_SMTP_USE_TLS=${MAIL_SMTP_USE_TLS:-1}
      - CHRONOS_BATCH_EMAILS=0 0 10 * * *
      - CHRONOS_SCHEDULE_JOBS=0 */10 * * * *
      - CHRONOS_UPDATE_TOKENS=0 0 0 1,15 * *
      - CHRONOS_PROCESS_RECURRENCE=0 */5 * * * *
      - CHRONOS_AUTOPAUSE=0 0 5 * * *

  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=parabol
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=parabol

  valkey:
    image: valkey/valkey:9.0-alpine
    restart: unless-stopped
    command: valkey-server --save "" --requirepass ${SERVICE_PASSWORD_VALKEY}

volumes:
  parabol-files: {}
  postgres-data: {}
